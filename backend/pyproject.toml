[project]
name = "ai-documentops-backend"
version = "1.0.0"
description = "Document automation pipeline: OCR, extraction, validation and HITL routing"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
