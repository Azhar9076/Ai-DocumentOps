version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: docops-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docops}
      POSTGRES_DB: ${POSTGRES_DB:-documentops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docops -d documentops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docops-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-docops}:${POSTGRES_PASSWORD:-docops}@postgres:5432/${POSTGRES_DB:-documentops}
      - WATSONX_APIKEY=${WATSONX_APIKEY:-}
      - WATSONX_PROJECT_ID=${WATSONX_PROJECT_ID:-}
      - WATSONX_URL=${WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
      - DOCOPS_AUTO_APPROVE_THRESHOLD=0.90
      - DOCOPS_REVIEW_THRESHOLD=0.70
      - DOCOPS_CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docops-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_BASE=http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  postgres_data:
